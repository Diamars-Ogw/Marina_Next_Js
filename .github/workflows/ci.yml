name: Next.js validation
on:
  push:
    branches: [rebuild/nextjs]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://test:test@127.0.0.1:5432/marina_test
      AUTH_SECRET: ci-only-secret-value-at-least-32-characters-long
      ADMIN_EMAIL: admin@example.test
      ADMIN_PASSWORD_HASH: "$2a$12$abcdefghijklmnopqrstuv"
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npx prisma validate
      - run: npm run build
